# Render Blueprint — one free web service that runs the API and serves the
# built web app from the same origin. Data lives in Turso (set the two secrets
# below in the Render dashboard). See DEPLOYMENT.md for the full walkthrough.
services:
  - type: web
    name: forge
    runtime: node
    plan: free
    region: oregon
    # Build the frontend (needs dev deps for Vite), then install the API.
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../api && npm install
    startCommand: cd api && node src/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Strong secrets generated by Render (never commit real ones).
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Seed demo data (demo@forge.dev / password123) on first boot.
      - key: SEED_ON_START
        value: "true"
      # Set these in the dashboard from your Turso database (sync:false = manual).
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
